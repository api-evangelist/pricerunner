aid: pricerunner
name: Pricerunner
description: 'Pricerunner is a product price-comparison platform founded in 1999 and
  owned by Klarna since 2022 (operated by Klarna Technologies AB). It helps shoppers
  compare prices and products across thousands of retailers in 13 countries (Sweden,
  Denmark, the UK, Norway, USA, Germany, Austria, Finland, France, Ireland, Italy,
  the Netherlands and Spain). Pricerunner markets a product-and-price-data API for
  retailers and businesses covering product search, competitor analysis, price history
  and automatic price matching across roughly 126 million daily-updated prices, but
  access is gated behind a sales contact form, with no public developer documentation,
  OpenAPI specification, or self-serve onboarding published.'
